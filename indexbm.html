<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e5a5a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Мессенджер</title>
<style>
:root{--bg:#eef2f0;--card:#fff;--ink:#16211f;--mute:#6b7a77;--acc:#0e5a5a;--accink:#fff;--line:#d8e0dd}
@media(prefers-color-scheme:dark){:root{--bg:#10171a;--card:#1b2629;--ink:#e6efed;--mute:#8aa09c;--acc:#2aa198;--accink:#06201e;--line:#2a3a3d}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.screen{display:none;height:100%;flex-direction:column;max-width:640px;margin:0 auto}
.screen.on{display:flex}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--acc);color:var(--accink);font-weight:600;font-size:18px}
header button{background:none;border:0;color:inherit;font-size:20px;padding:4px 8px}
header .sp{flex:1}
.auth{justify-content:center;padding:24px;gap:12px}
.auth h1{margin:0 0 8px;font-size:28px}
input{width:100%;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:16px}
button.main{padding:14px;border:0;border-radius:10px;background:var(--acc);color:var(--accink);font-size:16px;font-weight:600}
button.link{background:none;border:0;color:var(--acc);font-size:15px;padding:8px}
.err{color:#c0392b;min-height:20px;font-size:14px}
.list{flex:1;overflow-y:auto}
.row{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card);font-size:17px}
.empty{padding:24px;color:var(--mute);text-align:center}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:9px 12px;border-radius:14px;background:var(--card);word-wrap:break-word;white-space:pre-wrap}
.m.me{align-self:flex-end;background:var(--acc);color:var(--accink)}
.m small{display:block;opacity:.6;font-size:11px;margin-top:2px;text-align:right}
form.send{display:flex;gap:8px;padding:10px;background:var(--card);border-top:1px solid var(--line)}
form.send button{padding:0 18px;border:0;border-radius:10px;background:var(--acc);color:var(--accink);font-size:18px}
</style>
</head>
<body>

<div id="auth" class="screen auth on">
  <h1>Мессенджер</h1>
  <input id="u" placeholder="Логин (латиница, цифры)" autocapitalize="none" autocomplete="username">
  <input id="p" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password">
  <input id="inv" placeholder="Код приглашения" style="display:none" autocapitalize="none">
  <div class="err" id="err"></div>
  <button class="main" id="go">Войти</button>
  <button class="link" id="sw">Нет аккаунта? Зарегистрироваться</button>
</div>

<div id="list" class="screen">
  <header><span>Чаты</span><span class="sp"></span><span id="me" style="font-size:14px;font-weight:400"></span><button id="out" title="Выйти">⎋</button></header>
  <div style="padding:10px"><input id="q" placeholder="Найти по логину"></div>
  <div class="list" id="users"></div>
</div>

<div id="chat" class="screen">
  <header><button id="back">←</button><span id="peer"></span></header>
  <div class="msgs" id="msgs"></div>
  <form class="send" id="form"><input id="txt" placeholder="Сообщение" autocomplete="off"><button>➤</button></form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== ВСТАВЬТЕ СВОИ ДАННЫЕ ИЗ SUPABASE ======
const SUPABASE_URL = "ВСТАВЬТЕ_URL";
const SUPABASE_KEY = "ВСТАВЬТЕ_КЛЮЧ";
// ==============================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const DOMAIN = "@messenger.app";
let me = null, peer = null, users = [], reg = false, channel = null;

function show(id){ ["auth","list","chat"].forEach(s => $(s).classList.toggle("on", s === id)); }
function esc(t){ const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

$("sw").onclick = () => {
  reg = !reg;
  $("inv").style.display = reg ? "block" : "none";
  $("go").textContent = reg ? "Создать аккаунт" : "Войти";
  $("sw").textContent = reg ? "Уже есть аккаунт? Войти" : "Нет аккаунта? Зарегистрироваться";
  $("err").textContent = "";
};

$("go").onclick = async () => {
  const u = $("u").value.trim().toLowerCase(), p = $("p").value;
  $("err").textContent = "";
  if (!/^[a-z0-9_]{3,20}$/.test(u)) return $("err").textContent = "Логин: 3–20 символов, латиница, цифры, _";
  if (p.length < 6) return $("err").textContent = "Пароль слишком короткий";
  const email = u + DOMAIN;
  let r;
  if (reg) {
    r = await sb.auth.signUp({ email, password: p, options: { data: { username: u, invite: $("inv").value.trim() } } });
    if (r.error) return $("err").textContent = /invite|приглаш|Database error/i.test(r.error.message) ? "Неверный код приглашения или логин занят" : r.error.message;
    if (!r.data.session) r = await sb.auth.signInWithPassword({ email, password: p });
  } else {
    r = await sb.auth.signInWithPassword({ email, password: p });
  }
  if (r.error) return $("err").textContent = "Неверный логин или пароль";
  start(r.data.user);
};

$("out").onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function start(user) {
  me = user;
  $("me").textContent = user.user_metadata.username;
  const { data } = await sb.from("profiles").select("id,username").neq("id", me.id).order("username");
  users = data || [];
  renderUsers();
  show("list");
  if (channel) sb.removeChannel(channel);
  channel = sb.channel("msgs").on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, e => {
    const m = e.new;
    if (peer && ((m.sender === peer.id && m.receiver === me.id) || (m.sender === me.id && m.receiver === peer.id))) addMsg(m);
  }).subscribe();
}

function renderUsers() {
  const f = $("q").value.trim().toLowerCase();
  const l = users.filter(x => x.username.includes(f));
  $("users").innerHTML = l.length ? "" : '<div class="empty">Пока никого нет. Когда друзья зарегистрируются по вашему коду, они появятся здесь.</div>';
  l.forEach(x => { const d = document.createElement("div"); d.className = "row"; d.textContent = x.username; d.onclick = () => openChat(x); $("users").appendChild(d); });
}
$("q").oninput = renderUsers;

async function openChat(u) {
  peer = u; $("peer").textContent = u.username; $("msgs").innerHTML = ""; show("chat");
  const { data } = await sb.from("messages").select("*")
    .or(`and(sender.eq.${me.id},receiver.eq.${u.id}),and(sender.eq.${u.id},receiver.eq.${me.id})`)
    .order("created_at").limit(200);
  (data || []).forEach(addMsg);
}
$("back").onclick = () => { peer = null; show("list"); };

function addMsg(m) {
  const d = document.createElement("div");
  d.className = "m" + (m.sender === me.id ? " me" : "");
  const t = new Date(m.created_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  d.innerHTML = esc(m.body) + "<small>" + t + "</small>";
  $("msgs").appendChild(d);
  $("msgs").scrollTop = $("msgs").scrollHeight;
}

$("form").onsubmit = async e => {
  e.preventDefault();
  const body = $("txt").value.trim();
  if (!body || !peer) return;
  $("txt").value = "";
  const { error } = await sb.from("messages").insert({ receiver: peer.id, body });
  if (error) alert("Не удалось отправить: " + error.message);
};

sb.auth.getSession().then(({ data }) => { if (data.session) start(data.session.user); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
